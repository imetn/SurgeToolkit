# Surge macOS public template
# Add private proxies only after copying this file outside the repository.

[General]
loglevel = notify
ipv6 = true
dns-server = system
skip-proxy = 127.0.0.1, localhost, *.local

[Proxy]
# Add private proxies locally. Never commit them to this repository.

[Proxy Group]
Proxy = select, SelfHost, America, Singapore, Japan, Others
SelfHost = select, HK-Self, US-Self
America = select, US-Self, US-Public
Singapore = url-test, include-all-proxies=1, policy-regex-filter=(?i)\[SG\], url=http://www.gstatic.com/generate_204, interval=600, tolerance=100
Japan = fallback, include-all-proxies=1, policy-regex-filter=(?i)\[JP\], url=http://www.gstatic.com/generate_204, interval=600
Taiwan = url-test, include-all-proxies=1, policy-regex-filter=(?i)\[TW\], url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, hidden=1, no-alert=1
HongKong = url-test, include-all-proxies=1, policy-regex-filter=(?i)\[HK\], url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, hidden=1, no-alert=1
Others = select, Singapore, Japan, Taiwan, HongKong
Crypto = select, Taiwan, Japan, Others
OpenAI = select, US-Self, America, Others
Speedtest = select, DIRECT, HK-Self, US-Self, HK-Public, US-Public, Singapore, Japan
Download = select, DIRECT, Proxy, HK-Self, US-Self, HK-Public, US-Public
Stream = select, Proxy, America, Japan, Singapore, HongKong, Taiwan
Apple = select, Proxy, America
Microsoft = select, Proxy, America
Twitter = select, Proxy, America, Japan
Telegram = select, Proxy, America, Singapore
HK-Self = fallback, include-all-proxies=1, policy-regex-filter=(?i)(\[HK\].*\[Self\]|\[Self\].*\[HK\]), url=http://www.gstatic.com/generate_204, interval=600, hidden=1, no-alert=1
US-Self = fallback, include-all-proxies=1, policy-regex-filter=(?i)(\[US\].*\[Self\]|\[Self\].*\[US\]), url=http://www.gstatic.com/generate_204, interval=600, hidden=1, no-alert=1
HK-Public = url-test, include-all-proxies=1, policy-regex-filter=(?i)(\[HK\].*\[Public\]|\[Public\].*\[HK\]), url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, hidden=1, no-alert=1
US-Public = url-test, include-all-proxies=1, policy-regex-filter=(?i)(\[US\].*\[Public\]|\[Public\].*\[US\]), url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, hidden=1, no-alert=1

[Rule]
# Add macOS PROCESS-NAME rules here before the shared domain rules when needed.
# Domain and non-IP rules must stay before IP rules.
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/speedtest.conf,Speedtest,extended-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/apple_cdn.conf,DIRECT
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/download.conf,Download
RULE-SET,https://raw.githubusercontent.com/ennann/SurgeToolkit/main/Rules/speedtest.list,Speedtest
RULE-SET,https://raw.githubusercontent.com/ennann/SurgeToolkit/main/Rules/crypto.list,Crypto
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,OpenAI
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,Apple
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft.conf,Microsoft
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,Telegram
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,Stream
RULE-SET,https://ruleset.skk.moe/List/non_ip/download.conf,Download
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/direct.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/global.conf,Proxy
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT
# IP rules begin here.
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,Telegram
RULE-SET,https://ruleset.skk.moe/List/ip/domestic.conf,DIRECT
GEOIP,CN,DIRECT
FINAL,Proxy

[Host]
localhost = 127.0.0.1
